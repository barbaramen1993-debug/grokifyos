name: Android CI - Build APK

on:
  push:
    branches: [ main ]
    paths:
      - "android/**"
      - ".github/workflows/Damimain.yml"

  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant"
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug

      target:
        description: "Target module"
        required: true
        type: choice
        options:
          - phone
          - wear
          - wear-face
          - all
        default: phone

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ inputs.target || 'phone' }} (${{ inputs.variant || 'debug' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Android and Java environment
        run: |
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          sdkmanager --list_installed | grep -E "platforms;android-35|build-tools;35.0.0" || true

      - name: Make Gradle executable
        working-directory: android
        run: |
          chmod +x ./gradlew
          chmod +x ./scripts/build.sh

      - name: Build selected APK
        working-directory: android
        env:
          VARIANT: ${{ inputs.variant || 'debug' }}
          TARGET: ${{ inputs.target || 'phone' }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "GrokifyOS Android Build"
          echo "Variant: $VARIANT"
          echo "Target:  $TARGET"
          echo "========================================"

          ./scripts/build.sh "$VARIANT" "$TARGET"

      - name: Collect APKs
        run: |
          set -euo pipefail

          mkdir -p dist

          find android \
            -type f \
            -path "*/build/outputs/apk/*.apk" \
            -print \
            -exec cp {} dist/ \;

          echo "========================================"
          echo "Generated APKs:"
          echo "========================================"

          ls -lh dist

          test -n "$(find dist -name "*.apk" -print -quit)"

          sha256sum dist/*.apk > dist/SHA256SUMS.txt

          echo "========================================"
          echo "SHA256:"
          echo "========================================"

          cat dist/SHA256SUMS.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grokifyos-${{ inputs.target || 'phone' }}-${{ inputs.variant || 'debug' }}-${{ github.run_number }}

          path: |
            dist/*.apk
            dist/SHA256SUMS.txt

          if-no-files-found: error
          retention-days: 30
